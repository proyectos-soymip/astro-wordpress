name: Deploy a Firebase Hosting al publicar en GitHub

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [wordpress_post]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar Node.js y dependencias
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - run: npm install
      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MI_WEB_ASTRO }}'
          channelId: live
          projectId: mi-web-astro